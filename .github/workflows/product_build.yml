name: Product Page Generator

on:
  push:
    paths:
      - 'products.csv'
      - 'scripts/generate_product_pages.py'
    branches:
      - main

# Add this permissions section
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          # This ensures the action can push back
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
      
      - name: Generate product pages
        run: |
          python scripts/generate_product_pages.py
      
      # Changed 2026-10-28: no CI-skip marker in the message (Cloudflare Pages must deploy this commit); sitemap.xml staged; DEP-6 retry loop
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add product/ th/product/ products.json sitemap.xml
          if git diff --staged --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Auto-generate product pages and sitemap from CSV"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "::error::Could not push generated pages after 3 attempts."
          exit 1
